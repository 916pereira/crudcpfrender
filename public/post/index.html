<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cadastrar pessoa · Cadastro CPF</title><link rel="stylesheet" href="/style.css"></head><body><header><strong>Cadastro CPF</strong><nav><a href="/">Início</a><a href="/post/">Cadastrar</a><a href="/get/">Consultar</a><a href="/put/">Editar</a><a href="/delete/">Excluir</a></nav></header><main><p class="eyebrow">GESTÃO DE PESSOAS</p><h1>Cadastrar pessoa</h1><p class="intro">Preencha todos os campos para adicionar um novo registro.</p><form id="cadastro" class="panel grid"><label>CPF<input name="cpf" type="text" required inputmode="numeric"></label><label>Nome<input name="nome" type="text" required></label><label>Sobrenome<input name="sobrenome" type="text" required></label><label>E-mail<input name="email" type="email" required></label><label>Idade<input name="idade" type="number" required min="0" max="130" step="1"></label><label>Telefone<input name="telefone" type="text" required></label><label>Rua<input name="rua" type="text" required></label><label>Bairro<input name="bairro" type="text" required></label><label>Cidade<input name="cidade" type="text" required></label><label>Estado (UF)<input name="estado" type="text" required minlength="2" maxlength="2"></label><label>RG<input name="rg" type="text" required></label><div class="full"><button>Salvar cadastro</button></div></form><p id="mensagem" role="status" aria-live="polite"></p></main><footer>CRUD com Node.js, Express e JSON Server · Dados de exemplo fictícios</footer><script src="/common.js"></script><script src="/post/post.js"></script></body></html>
